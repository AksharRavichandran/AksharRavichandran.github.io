<!DOCTYPE html>
<html>
<head>
  <title>Spotify Authorization</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #0a0b10;
      color: #e8ebff;
    }
    .container {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      padding: 30px;
    }
    button {
      background: linear-gradient(135deg, #7a7dff, #00ffd5);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 0;
    }
    button:hover {
      transform: translateY(-1px);
    }
    .token-display {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
    }
    .instructions {
      background: rgba(122,125,255,0.1);
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border-left: 3px solid #7a7dff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Spotify Authorization</h1>
    
    <div class="instructions">
      <strong>Step 1:</strong> Click the button below to authorize with Spotify<br>
      <strong>Step 2:</strong> After redirect, copy the access token shown below<br>
      <strong>Step 3:</strong> Use it with: <code>node scripts/fetch-spotify-data.js YOUR_TOKEN</code>
    </div>

    <button onclick="authorize()">Authorize with Spotify</button>
    
    <div id="result"></div>
  </div>

  <script>
    const CLIENT_ID = '3ccf28673893484c8d7939143c1937a0';
    // Use the full file path or localhost - update this to match your Spotify app redirect URI
    const REDIRECT_URI = window.location.href.split('?')[0]; // Current page URL
    const SCOPES = 'user-top-read';

    // Check if we're returning from Spotify
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const error = urlParams.get('error');

    if (error) {
      document.getElementById('result').innerHTML = 
        `<div class="token-display" style="color: #ff6b6b;">
          ❌ Authorization failed: ${error}
        </div>`;
    } else if (code) {
      // Exchange code for token
      exchangeCode(code);
    }

    function authorize() {
      const codeVerifier = generateCodeVerifier();
      sessionStorage.setItem('code_verifier', codeVerifier);
      
      sha256(codeVerifier).then(codeChallenge => {
        const state = generateRandomString(16);
        sessionStorage.setItem('state', state);
        
        const params = new URLSearchParams({
          response_type: 'code',
          client_id: CLIENT_ID,
          scope: SCOPES,
          redirect_uri: REDIRECT_URI,
          code_challenge_method: 'S256',
          code_challenge: codeChallenge,
          state: state
        });
        
        window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
      });
    }

    async function exchangeCode(code) {
      const codeVerifier = sessionStorage.getItem('code_verifier');
      const state = sessionStorage.getItem('state');
      
      // Verify state
      const urlParams = new URLSearchParams(window.location.search);
      const returnedState = urlParams.get('state');
      
      if (returnedState !== state) {
        document.getElementById('result').innerHTML = 
          `<div class="token-display" style="color: #ff6b6b;">
            ❌ State mismatch. Please try again.
          </div>`;
        return;
      }

      document.getElementById('result').innerHTML = 
        '<div class="token-display">🔄 Exchanging code for token...</div>';

      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: REDIRECT_URI,
            client_id: CLIENT_ID,
            code_verifier: codeVerifier,
          }),
        });

        if (!response.ok) {
          const error = await response.text();
          throw new Error(error);
        }

        const data = await response.json();
        
        document.getElementById('result').innerHTML = `
          <div class="token-display">
            <strong>✅ Success! Your access token:</strong><br><br>
            <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; margin: 10px 0;">
              ${data.access_token}
            </div>
            <br>
            <strong>Now run:</strong><br>
            <code style="background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 4px; display: inline-block; margin-top: 10px;">
              node scripts/fetch-spotify-data.js ${data.access_token}
            </code>
          </div>
        `;
        
        // Clean URL
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (error) {
        document.getElementById('result').innerHTML = 
          `<div class="token-display" style="color: #ff6b6b;">
            ❌ Error: ${error.message}
          </div>`;
      }
    }

    function generateCodeVerifier() {
      return generateRandomString(128);
    }

    function generateRandomString(length) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      const hash = await crypto.subtle.digest('SHA-256', data);
      const bytes = new Uint8Array(hash);
      const binary = Array.from(bytes)
        .map((b) => String.fromCharCode(b))
        .join('');
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  </script>
</body>
</html>
